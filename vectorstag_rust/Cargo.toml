[package]
name = "vectorstag_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "vectorstag_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"

# SVG parsing (own implementation)
roxmltree = "0.20"
regex = "1"

# Text rendering
fontdb = "0.16"
ttf-parser = "0.20"
rustybuzz = "0.12"

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.22"

# Static initialization
once_cell = "1.19"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Enable native CPU features for better SIMD
[profile.release.build-override]
opt-level = 3
