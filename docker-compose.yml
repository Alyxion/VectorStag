services:
  claude:
    build:
      context: .
      target: dev
    image: vectorstag-dev
    container_name: vectorstag-claude
    stdin_open: true
    tty: true
    environment:
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
      - TERM=xterm-256color
      - HOME=/home/dev
    volumes:
      # Project files
      - .:/workspace
      # Claude credentials (needs write access for debug logs)
      - ${HOME}/.claude:/home/dev/.claude
      # Persist poetry cache
      - poetry-cache:/home/dev/.cache/pypoetry
      # Persist venv (speeds up restarts)
      - venv-cache:/workspace/.venv
    working_dir: /workspace

  # Alternative: just run a shell
  shell:
    build:
      context: .
      target: dev
    image: vectorstag-dev
    container_name: vectorstag-shell
    stdin_open: true
    tty: true
    environment:
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
      - TERM=xterm-256color
      - HOME=/home/dev
    volumes:
      - .:/workspace
      - ${HOME}/.claude:/home/dev/.claude
      - poetry-cache:/home/dev/.cache/pypoetry
      - venv-cache:/workspace/.venv
    working_dir: /workspace
    command: bash -c "poetry config virtualenvs.in-project true && poetry install --no-interaction 2>/dev/null; exec bash"
    profiles:
      - shell

volumes:
  poetry-cache:
  venv-cache:
